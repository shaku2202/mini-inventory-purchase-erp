# Local PostgreSQL for development (alternative to `npm run db:local`).
# Usage: docker compose up -d   -> postgres://erp_user:erp_local_pw@localhost:5433/erp_db
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: ${LOCAL_PG_PASSWORD:-erp_local_pw}
      POSTGRES_DB: erp_db
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp_user -d erp_db']
      interval: 5s
      retries: 10
volumes:
  pgdata:
