# Netlify configuration (site base directory: frontend)
[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"
  # Public API base URL baked into the static build (not a secret).
  VITE_API_URL = "https://mini-inventory-purchase-erp.onrender.com/api"

# SPA: every unknown path is served by index.html so client-side routes
# like /purchase-orders/3 work on refresh / direct link.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
